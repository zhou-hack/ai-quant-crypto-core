[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-crypto-core"
version = "0.1.0"
description = "LLM and JEV based crypto market decision core"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.24",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
